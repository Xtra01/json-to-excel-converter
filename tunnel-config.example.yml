# Cloudflare Tunnel Configuration Example
# Copy this file to tunnel-config.yml and update with your values

tunnel: YOUR_TUNNEL_ID_HERE  # Replace with your actual tunnel ID
credentials-file: /path/to/your/credentials.json  # Replace with your actual path

ingress:
  - hostname: your-domain.com  # Replace with your actual domain
    service: http://localhost:80
  - hostname: "*.your-domain.com"  # Replace with your actual domain (for subdomains)
    service: http://localhost:80
  - service: http_status:404

# Example systemd service configuration:
# Save this as /etc/systemd/system/cloudflare-tunnel.service
#
# [Unit]
# Description=Cloudflare Tunnel Service
# After=network-online.target
# Wants=network-online.target
#
# [Service]
# Type=simple
# User=your-username
# Group=your-username
# WorkingDirectory=/home/your-username
# ExecStart=/usr/local/bin/cloudflared tunnel --config /home/your-username/tunnel-config.yml run your-tunnel-name
# Restart=always
# RestartSec=10
# KillMode=mixed
# TimeoutStopSec=120
#
# [Install]
# WantedBy=multi-user.target