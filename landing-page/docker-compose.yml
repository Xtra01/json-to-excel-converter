version: '3.8'

services:
  landing-page:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devtestenv-landing
    restart: unless-stopped
    ports:
      - "3001:80"
    networks:
      - devtestenv
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.devtestenv.service=landing-page"
      - "com.devtestenv.description=Main landing page for DevTestEnv platform"

networks:
  devtestenv:
    driver: bridge
